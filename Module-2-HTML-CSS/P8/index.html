
<!DOCTYPE html>
<html>
<head>
    <title>Sticky Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>My Website</h2>
        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <main>
        <h1>Welcome to My Website</h1>

        <div class="card">
            <img src="https://picsum.photos/600/350"
            alt="Nature Image">

            <div class="overlay">
                <h2>Beautiful Nature</h2>
                <p>Enjoy the beauty of nature.</p>
            </div>
        </div>

        <p>Scroll down to see the sticky navbar in action.</p>

        <div class="content">
            <h2>More Content</h2>
            <p>This is some extra content for scrolling.</p>
        </div>

    </main>

</body>
</html>
